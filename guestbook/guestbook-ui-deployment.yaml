apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  progressDeadlineSeconds: 60
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: gcr.io/google-samples/gb-frontend:invalid
        
          name: guestbook-ui
          ports:
            - containerPort: 80
